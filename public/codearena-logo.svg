<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">CodeArena logo</title>
  <desc id="desc">Angular neon violet and cyan coding emblem with CodeArena wordmark on a transparent background.</desc>
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0abfc"/><stop offset=".45" stop-color="#a855f7"/><stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/><stop offset=".45" stop-color="#38bdf8"/><stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="wordWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="wordPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b4fe"/><stop offset=".48" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glowV" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowC" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Emblem: sharp interlocking C / A / code-bracket motif -->
  <g transform="translate(24 18)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M132 13 L48 60 L13 113 L48 166 L92 191 L92 160 L56 139 L37 113 L60 82 L132 42 Z" fill="url(#violet)" stroke="#c084fc" stroke-width="2" filter="url(#glowV)"/>
    <path d="M147 13 L218 55 L246 91 L246 137 L215 173 L180 194 L180 157 L208 139 L224 117 L207 92 L177 73 L177 48 L147 31 Z" fill="url(#cyan)" stroke="#7dd3fc" stroke-width="2" filter="url(#glowC)"/>
    <path d="M113 80 L143 61 L143 157 L113 176 Z" fill="url(#violet)" stroke="#d8b4fe" stroke-width="1.5" filter="url(#glowV)"/>
    <path d="M149 13 L177 30 L177 191 L149 210 Z" fill="url(#cyan)" stroke="#93c5fd" stroke-width="1.5" filter="url(#glowC)"/>
    <path d="M149 210 L184 190 L216 171 L245 139 L263 113 L245 88 L220 69 L201 58 L201 92 L220 107 L230 117 L215 132 L184 151 L149 170 Z" fill="url(#violet)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glowV)"/>
    <path d="M5 113 L38 94 L38 132 Z" fill="url(#cyan)" stroke="#7dd3fc" stroke-width="1.5"/>
    <path d="M263 113 L230 94 L230 132 Z" fill="url(#violet)" stroke="#c084fc" stroke-width="1.5"/>
    <path d="M148 13 L148 210" stroke="#e9d5ff" stroke-opacity=".75" stroke-width="2"/>
    <path d="M30 57 Q130 -12 226 57" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity=".8"/>
    <path d="M30 169 Q130 238 226 169" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity=".65"/>
  </g>
  <!-- Wordmark -->
  <g font-family="Inter, Montserrat, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-5">
    <text x="325" y="184" fill="url(#wordWhite)">Code</text>
    <text x="565" y="184" fill="url(#wordPurple)">Arena</text>
  </g>
  <path d="M329 207 H1004" stroke="#8b5cf6" stroke-opacity=".38" stroke-width="2"/>
  <path d="M329 207 H490" stroke="#67e8f9" stroke-opacity=".85" stroke-width="2"/>
</svg>
